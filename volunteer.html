<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Registration — Nirbhorota Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="section-pad">
    <div class="container" style="max-width: 760px;">
      <h1 class="h2 mb-2">Volunteer Registration</h1>
      <p class="mb-4" style="color: var(--nf-muted);">
        Applications are stored privately in Firestore and reviewed only by authorized foundation administrators.
      </p>

      <form id="volunteer-form" class="editorial-card p-4 p-md-5 needs-validation" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="vol-name" class="form-label">Full Name *</label>
            <input type="text" id="vol-name" class="form-control" required minlength="2" maxlength="120" />
          </div>
          <div class="col-md-6">
            <label for="vol-email" class="form-label">Email Address *</label>
            <input type="email" id="vol-email" class="form-control" required maxlength="150" />
          </div>
          <div class="col-md-6">
            <label for="vol-phone" class="form-label">Phone Number *</label>
            <input type="tel" id="vol-phone" class="form-control" required minlength="6" maxlength="30" />
          </div>
          <div class="col-md-6">
            <label for="vol-location" class="form-label">Location (District / Area) *</label>
            <input type="text" id="vol-location" class="form-control" required maxlength="120" />
          </div>
          <div class="col-md-6">
            <label for="vol-interest" class="form-label">Areas of Interest *</label>
            <select id="vol-interest" class="form-select" required>
              <option value="">Choose an area...</option>
              <option value="Education & Tutoring">Education &amp; Tutoring</option>
              <option value="Health & Awareness">Health &amp; Awareness</option>
              <option value="Field & Logistics">Field &amp; Logistics</option>
              <option value="Documentation & Outreach">Documentation &amp; Outreach</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="vol-availability" class="form-label">Availability *</label>
            <input type="text" id="vol-availability" class="form-control" placeholder="e.g., Weekends, 4 hrs/week" required maxlength="120" />
          </div>
          <div class="col-12">
            <label for="vol-skills" class="form-label">Relevant Skills</label>
            <input type="text" id="vol-skills" class="form-control" maxlength="200" />
          </div>
          <div class="col-12">
            <label for="vol-intro" class="form-label">Short Introduction *</label>
            <textarea id="vol-intro" class="form-control" rows="4" required minlength="15" maxlength="1000"></textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="vol-consent" required />
              <label class="form-check-label small" for="vol-consent">
                I consent to Nirbhorota Foundation storing my application for volunteer coordination in accordance with the <a href="privacy.html">Privacy Policy</a>. *
              </label>
            </div>
          </div>
          <div class="col-12 pt-2">
            <button type="submit" id="vol-submit" class="btn btn-nf-primary">Submit Application</button>
          </div>
        </div>
        <div id="vol-feedback" class="mt-3" role="alert"></div>
      </form>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
  <script type="module">
    import { submitVolunteerApplication, showToast } from "./assets/js/firebase-service.js";

    const form = document.getElementById("volunteer-form");
    const submitBtn = document.getElementById("vol-submit");
    const feedback = document.getElementById("vol-feedback");
    let submitting = false;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitting) return;
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        feedback.innerHTML = `<div class="alert alert-danger py-2 small mb-0">Please complete all required fields accurately.</div>`;
        return;
      }

      submitting = true;
      submitBtn.disabled = true;
      feedback.innerHTML = "";

      try {
        await submitVolunteerApplication({
          fullName: document.getElementById("vol-name").value.trim(),
          email: document.getElementById("vol-email").value.trim(),
          phone: document.getElementById("vol-phone").value.trim(),
          location: document.getElementById("vol-location").value.trim(),
          areaOfInterest: document.getElementById("vol-interest").value,
          availability: document.getElementById("vol-availability").value.trim(),
          skills: document.getElementById("vol-skills").value.trim(),
          introduction: document.getElementById("vol-intro").value.trim(),
          consent: true
        });
        form.reset();
        form.classList.remove("was-validated");
        feedback.innerHTML = `<div class="alert alert-success py-2 small mb-0">Your volunteer registration has been submitted.</div>`;
        showToast("Volunteer application submitted.", "success");
      } catch (err) {
        feedback.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${err.message}</div>`;
        showToast(err.message, "error");
      } finally {
        submitting = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
