<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Nirbhorota Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="section-pad">
    <div class="container" style="max-width: 760px;">
      <h1 class="h2 mb-2" data-i18n="navContact">Contact Us</h1>
      <p class="mb-4" style="color: var(--nf-muted);">Messages are stored privately in Firestore for review by authorized staff.</p>
      <form id="contact-form" class="editorial-card p-4 p-md-5 needs-validation" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="msg-name" class="form-label">Name *</label>
            <input type="text" id="msg-name" class="form-control" required minlength="2" maxlength="120" />
          </div>
          <div class="col-md-6">
            <label for="msg-email" class="form-label">Email *</label>
            <input type="email" id="msg-email" class="form-control" required maxlength="150" />
          </div>
          <div class="col-12">
            <label for="msg-subject" class="form-label">Subject *</label>
            <input type="text" id="msg-subject" class="form-control" required minlength="2" maxlength="160" />
          </div>
          <div class="col-12">
            <label for="msg-body" class="form-label">Message *</label>
            <textarea id="msg-body" class="form-control" rows="4" required minlength="5" maxlength="2000"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" id="msg-submit" class="btn btn-nf-primary">Send Message</button>
          </div>
        </div>
        <div id="msg-feedback" class="mt-3" role="alert"></div>
      </form>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
  <script type="module">
    import { submitContactMessage, showToast } from "./assets/js/firebase-service.js";
    const form = document.getElementById("contact-form");
    const feedback = document.getElementById("msg-feedback");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }
      try {
        await submitContactMessage({
          name: document.getElementById("msg-name").value.trim(),
          email: document.getElementById("msg-email").value.trim(),
          subject: document.getElementById("msg-subject").value.trim(),
          message: document.getElementById("msg-body").value.trim()
        });
        form.reset();
        form.classList.remove("was-validated");
        feedback.innerHTML = `<div class="alert alert-success py-2 small mb-0">Message sent.</div>`;
        showToast("Message sent.", "success");
      } catch (err) {
        feedback.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${err.message}</div>`;
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
