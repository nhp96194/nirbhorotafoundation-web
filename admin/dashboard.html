<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Nirbhorota Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <div id="admin-gate" class="container py-5 text-center">
    <p class="mb-0" style="color: var(--nf-muted);">Verifying administrator session...</p>
  </div>

  <div id="admin-shell" class="d-none">
    <nav class="navbar navbar-dark bg-dark px-3">
      <span class="navbar-brand mb-0 h6">Nirbhorota Admin</span>
      <div class="d-flex align-items-center gap-3">
        <span id="admin-user-email" class="text-light small"></span>
        <button type="button" id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex flex-wrap gap-2 mb-4">
        <a href="dashboard.html" class="btn btn-nf-primary btn-sm">Overview</a>
        <a href="../index.html" class="btn btn-nf-secondary btn-sm">Public Site</a>
      </div>

      <h1 class="h3 mb-4">Live Content Counts</h1>
      <div id="metrics-row" class="row g-3">
        <div class="col-6 col-md-3"><div class="editorial-card p-3"><div class="small text-muted">Total Projects</div><div class="h4 mb-0" id="count-projects">0</div></div></div>
        <div class="col-6 col-md-3"><div class="editorial-card p-3"><div class="small text-muted">Published Projects</div><div class="h4 mb-0" id="count-published">0</div></div></div>
        <div class="col-6 col-md-3"><div class="editorial-card p-3"><div class="small text-muted">Volunteer Applications</div><div class="h4 mb-0" id="count-volunteers">0</div></div></div>
        <div class="col-6 col-md-3"><div class="editorial-card p-3"><div class="small text-muted">Contact Messages</div><div class="h4 mb-0" id="count-messages">0</div></div></div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      initFirebase,
      onAuthStateChanged,
      signOut,
      collection,
      getDocs,
      showToast
    } from "../assets/js/firebase-service.js";

    const { configured, auth, db } = initFirebase();
    const gate = document.getElementById("admin-gate");
    const shell = document.getElementById("admin-shell");
    const emailEl = document.getElementById("admin-user-email");
    const logoutBtn = document.getElementById("logout-btn");

    if (!configured) {
      gate.innerHTML = `<div class="placeholder-notice text-start">Configure Firebase in <code>assets/js/firebase-config.js</code> to use the admin dashboard.</div>`;
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.replace("login.html");
          return;
        }
        const token = await user.getIdTokenResult();
        if (!token.claims.admin) {
          gate.innerHTML = `
            <div class="alert alert-danger text-start">
              Account <strong>${user.email}</strong> does not have the <code>admin</code> custom claim required by Firestore security rules.
            </div>`;
          return;
        }

        emailEl.textContent = user.email;
        gate.classList.add("d-none");
        shell.classList.remove("d-none");

        try {
          const [projSnap, volSnap, msgSnap] = await Promise.all([
            getDocs(collection(db, "projects")),
            getDocs(collection(db, "volunteers")),
            getDocs(collection(db, "contactMessages"))
          ]);
          const pubCount = projSnap.docs.filter((d) => d.data().published === true).length;
          document.getElementById("count-projects").textContent = String(projSnap.size);
          document.getElementById("count-published").textContent = String(pubCount);
          document.getElementById("count-volunteers").textContent = String(volSnap.size);
          document.getElementById("count-messages").textContent = String(msgSnap.size);
        } catch (err) {
          showToast(err.message, "error");
        }
      });
    }

    logoutBtn?.addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("login.html");
    });
  </script>
</body>
</html>
