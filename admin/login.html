<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — Nirbhorota Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body class="d-flex align-items-center min-vh-100" style="background-color: var(--nf-sage);">
  <div class="container" style="max-width: 440px;">
    <div class="editorial-card p-4 p-md-5">
      <p class="small fw-semibold mb-1" style="color: var(--nf-green);">NIRBHOROTA FOUNDATION</p>
      <h1 class="h4 mb-3">Administrator Sign In</h1>
      <p class="small mb-4" style="color: var(--nf-muted);">
        Public registration is disabled. Authorized administrators must have custom claim authorization.
      </p>

      <form id="login-form">
        <div class="mb-3">
          <label for="admin-email" class="form-label">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label for="admin-password" class="form-label">Password</label>
          <input type="password" id="admin-password" class="form-control" required autocomplete="current-password" />
        </div>
        <div class="d-grid gap-2">
          <button type="submit" id="login-btn" class="btn btn-nf-primary">Sign In</button>
          <button type="button" id="reset-btn" class="btn btn-link btn-sm text-decoration-none">Send Password Reset Email</button>
        </div>
      </form>
      <div id="auth-msg" class="mt-3 small" role="alert"></div>
      <div class="mt-4 pt-3 border-top small">
        <a href="../index.html">&larr; Return to Public Website</a>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      initFirebase,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      showToast
    } from "../assets/js/firebase-service.js";

    const { configured, auth } = initFirebase();
    const form = document.getElementById("login-form");
    const resetBtn = document.getElementById("reset-btn");
    const msgEl = document.getElementById("auth-msg");

    if (!configured) {
      msgEl.innerHTML = `<span class="text-danger">Firebase is not configured in <code>assets/js/firebase-config.js</code>.</span>`;
    } else {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace("dashboard.html");
        }
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!configured) return;
      const email = document.getElementById("admin-email").value.trim();
      const pass = document.getElementById("admin-password").value;
      msgEl.textContent = "Signing in...";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showToast("Signed in.", "success");
        window.location.replace("dashboard.html");
      } catch (err) {
        msgEl.className = "mt-3 small text-danger";
        msgEl.textContent = err.message;
      }
    });

    resetBtn.addEventListener("click", async () => {
      if (!configured) return;
      const email = document.getElementById("admin-email").value.trim();
      if (!email) {
        msgEl.className = "mt-3 small text-danger";
        msgEl.textContent = "Enter your admin email above first.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        msgEl.className = "mt-3 small text-success";
        msgEl.textContent = "Password reset email sent if the account exists.";
      } catch (err) {
        msgEl.className = "mt-3 small text-danger";
        msgEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
