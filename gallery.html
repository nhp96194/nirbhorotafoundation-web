<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery | Nirbhorota Foundation</title><meta name="description" content="Nirbhorota Foundation - humanitarian and community support."><meta property="og:title" content="Gallery | Nirbhorota Foundation"><meta property="og:type" content="website">
<link rel="icon" href="assets/images/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet"></head><body>
<header id="hdr"></header>
<main><section class="sec"><div class="container"><span class="kicker" data-i="nav_gallery"></span><h1 data-i="gal_h"></h1><div class="row g-2 my-4"><div class="col-md-4"><select id="cat" class="form-select" aria-label="Category"></select></div></div><div id="box" class="gal-grid" aria-live="polite"></div></div></section>
<div class="modal fade" id="lb" tabindex="-1" aria-label="Photo"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content bg-dark"><button class="btn-close btn-close-white ms-auto m-2" data-bs-dismiss="modal" aria-label="Close"></button><img id="lbi" class="img-fluid" alt=""><p id="lbc" class="text-white p-3 mb-0"></p></div></div></div></main>
<footer id="ftr"></footer>
<script type="module">import {init,fetchPub,t,esc,L} from "./assets/js/site.js";await init();
const box=document.getElementById("box"),sel=document.getElementById("cat"),$=i=>document.getElementById(i);let it=[];
try{it=await fetchPub("gallery")}catch(e){box.innerHTML='<p class="empty">'+t("err")+'</p>'}
sel.innerHTML='<option value="">'+t("all_c")+'</option>'+[...new Set(it.map(x=>x.category).filter(Boolean))].map(c=>'<option>'+esc(c)+'</option>').join("");
const draw=()=>{const r=it.filter(x=>!sel.value||x.category===sel.value);box._r=r;box.innerHTML=r.length?r.map((x,i)=>'<img class="gi" tabindex="0" loading="lazy" data-k="'+i+'" src="'+esc(x.image)+'" alt="'+esc(L(x,"caption"))+'">').join(""):'<p class="empty">'+t("none")+'</p>'};
sel.onchange=draw;draw();
const m=new bootstrap.Modal($("lb")),open=e=>{const g=e.target.closest(".gi");if(!g)return;const x=box._r[+g.dataset.k];$("lbi").src=x.image;$("lbi").alt=L(x,"caption");$("lbc").textContent=L(x,"caption");m.show()};
box.onclick=open;box.onkeydown=e=>{if(e.key==="Enter")open(e)};</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
