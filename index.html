<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nirbhorota Foundation</title><meta name="description" content="Nirbhorota Foundation - humanitarian and community support."><meta property="og:title" content="Nirbhorota Foundation"><meta property="og:type" content="website">
<link rel="icon" href="assets/images/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet"></head><body>
<header id="hdr"></header>
<main>
<section class="hero"><div class="container"><div class="row align-items-center g-5"><div class="col-lg-7"><span class="kicker">Nirbhorota · নির্ভরতা</span>
<h1 id="ht"></h1><p class="my-4" id="hs"></p><a class="btn btn-main me-2 mb-2" href="projects.html" data-i="cta1"></a><a class="btn btn-line mb-2" href="volunteer.html" data-i="cta2"></a></div>
<div class="col-lg-5"><div class="hero-art" id="art"><img class="mark" src="assets/images/logo.svg" alt=""></div></div></div></div></section>
<section class="sec alt reveal"><div class="container"><span class="kicker" data-i="mission_h"></span><h2 class="col-lg-8" id="ms"></h2></div></section>
<section class="sec reveal"><div class="container"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="kicker" data-i="nav_projects"></span><h2 data-i="feat"></h2></div><a href="projects.html">→</a></div><div id="fp" class="grid"></div></div></section>
<section class="sec alt reveal" id="donate"><div class="container"><span class="kicker" data-i="nav_donate"></span><h2 data-i="don_h"></h2><p class="text-muted mt-2" data-i="pay_note"></p><div class="row g-3 mt-1" id="pay"></div><div class="prose mt-4" id="dn"></div></div></section>
<section class="sec reveal"><div class="container"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="kicker" data-i="nav_stories"></span><h2 data-i="news"></h2></div><a href="stories.html">→</a></div><div id="ls" class="grid"></div></div></section>
<section class="sec reveal"><div class="container"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="kicker" data-i="nav_gallery"></span><h2 data-i="gal_h"></h2></div><a href="gallery.html">→</a></div><div id="gp"></div></div></section>
<section class="sec stats" id="stats" hidden><div class="container"><div class="row g-4 text-center" id="sg"></div></div></section>
<section class="sec alt reveal"><div class="container text-center"><h2 data-i="vol_h"></h2><p class="text-muted" data-i="vol_d"></p><a class="btn btn-main" href="volunteer.html" data-i="cta2"></a></div></section></main>
<footer id="ftr"></footer>
<script type="module">import {init,fetchPub,card,t,esc,L} from "./assets/js/site.js";
const s=await init(),$=i=>document.getElementById(i);
$("ht").textContent=L(s,"heroTitle")||t("hero_t");$("hs").textContent=L(s,"heroSubtitle")||t("hero_s");
if(/^https?:/.test(s.heroImage||""))$("art").innerHTML='<img src="'+esc(s.heroImage)+'" alt="">';
$("ms").textContent=L(s,"mission")||t("mission_d");$("dn").textContent=L(s,"donation")||"";
for(const [c,id] of [["projects","fp"],["stories","ls"]]){try{const r=(await fetchPub(c)).slice(0,3);$(id).innerHTML=r.length?r.map(p=>card(p,c)).join(""):'<p class="empty">'+t("none")+'</p>'}catch(e){$(id).innerHTML='<p class="empty">'+t("err")+'</p>'}}
const pc=(h,n,sub)=>'<div class="col-md-4"><div class="pay"><small>'+esc(h)+'</small><strong>'+esc(n)+'</strong>'+(sub?'<span>'+esc(sub)+'</span>':'')+'<button class="btn btn-sm btn-line cp mt-1" data-n="'+esc(n)+'">'+t("copy")+'</button></div></div>';
$("pay").innerHTML=(s.bkash?pc(t("bkash"),s.bkash,"Personal / Merchant"):"")+(s.nagad?pc(t("nagad"),s.nagad,"Personal"):"")+(s.bankAccount?pc(t("bank"),s.bankAccount,[s.bankName,s.bankHolder].filter(Boolean).join(" · ")):"");
$("pay").onclick=e=>{const b=e.target.closest(".cp");if(!b)return;navigator.clipboard.writeText(b.dataset.n).then(()=>{b.textContent=t("copied");setTimeout(()=>b.textContent=t("copy"),1500)})};
const sv=[["statFamilies","st_f"],["statProjects","st_p"],["statVolunteers","st_v"],["statDistricts","st_d"]].filter(([k])=>+s[k]>0);
if(sv.length){$("stats").hidden=false;$("sg").innerHTML=sv.map(([k,l])=>'<div class="col-6 col-md-3"><div class="num">'+esc(s[k])+'+</div><div>'+t(l)+'</div></div>').join("")}
try{const g=(await fetchPub("gallery")).slice(0,4);$("gp").innerHTML=g.length?g.map(x=>'<a href="gallery.html"><img class="gi-s" loading="lazy" src="'+esc(x.image)+'" alt="'+esc(L(x,"caption"))+'"></a>').join(""):'<p class="empty">'+t("none")+'</p>'}catch(e){}
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
