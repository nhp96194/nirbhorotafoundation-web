<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Nirbhorota Foundation</title>
  <meta name="description" content="Browse ongoing, completed, and upcoming community initiatives from Nirbhorota Foundation." />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="section-pad">
    <div class="container">
      <h1 class="h2 mb-2" data-i18n="navProjects">Projects</h1>
      <p class="mb-4" style="color: var(--nf-muted);">Filter published initiatives by search term, category, or status.</p>

      <div class="row g-3 mb-4">
        <div class="col-md-5">
          <label for="project-search" class="form-label visually-hidden">Search projects</label>
          <input id="project-search" type="search" class="form-control" data-i18n-placeholder="searchPlaceholder" placeholder="Search projects..." />
        </div>
        <div class="col-md-3">
          <label for="project-category" class="form-label visually-hidden">Category</label>
          <select id="project-category" class="form-select">
            <option value="" data-i18n="allCategories">All Categories</option>
            <option value="Education">Education</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Community Relief">Community Relief</option>
            <option value="Livelihood">Livelihood</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="project-status" class="form-label visually-hidden">Status</label>
          <select id="project-status" class="form-select">
            <option value="" data-i18n="allStatuses">All Statuses</option>
            <option value="Ongoing" data-i18n="statusOngoing">Ongoing</option>
            <option value="Completed" data-i18n="statusCompleted">Completed</option>
            <option value="Upcoming" data-i18n="statusUpcoming">Upcoming</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="button" id="reset-filters" class="btn btn-nf-secondary">Reset</button>
        </div>
      </div>

      <div id="projects-list" class="row g-4"></div>
      <div class="text-center mt-4">
        <button type="button" id="load-more-btn" class="btn btn-nf-primary" hidden>Load More</button>
      </div>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/projects.js"></script>
</body>
</html>
